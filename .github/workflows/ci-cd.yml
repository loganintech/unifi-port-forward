name: Build and Publish Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference and tags
        id: meta
        run: |
          # Publish to whichever repository this workflow is running in. GHCR
          # paths are ghcr.io/<owner>/<name>, which is exactly $GITHUB_REPOSITORY,
          # so this resolves to ghcr.io/fiskhest/unifi-port-forward upstream and
          # to a fork's own namespace in a fork - no per-repo edits, and nothing
          # fork-specific to strip out before sending a change upstream.
          #
          # GHCR rejects uppercase, which owner names are allowed to contain.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "date-tag=$(date +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/bake-action@v6
        with:
          push: true
          set: |
            controller.tags+=${{ steps.meta.outputs.image }}:latest
            controller.tags+=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date-tag }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
